name: Controller and motion regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 requests==2.34.2 einops==0.8.2
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install 'viser @ git+https://github.com/nv-tlabs/kimodo-viser.git@7c82ad8f8640bad9dff8ded5c5eee908eeb08f11'
      - run: python -m unittest discover -v -p 'test_*.py'

  studio-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio_client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: studio_client/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node --experimental-strip-types --test src/*.test.mjs tests/*.test.mjs
